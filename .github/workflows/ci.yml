name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint --workspace apps/web

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://ci-build.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-build-anon-key-no-secret
          NEXT_PUBLIC_APP_URL: https://ci-build.kaza.local
          NEXT_PUBLIC_HCAPTCHA_SITEKEY: ci-build-sitekey-no-secret

      - name: Secret leak scan (frontend + edge functions)
        run: |
          if grep -rnEi "(sk_live_|sk_dev_|sbp_[A-Za-z0-9]{16,}|vcp_[A-Za-z0-9]{16,}|xkeysib-|xox[bap]-|service_role\s*[:=]\s*['\"][a-zA-Z0-9]{20,}|BEGIN (RSA|EC|OPENSSH|DSA) PRIVATE KEY|KazaDemo)" apps/web/src supabase/functions | grep -vE ':[0-9]+: \*|:[0-9]+: //' ; then
            echo "::error::Secret ou clé détecté(e) dans le code source. Retirez-le avant de merger."
            exit 1
          fi

  integration-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Install Supabase CLI (pinned)
        run: |
          curl -fsSL https://github.com/supabase/cli/releases/download/v2.114.0/supabase_linux_amd64.tar.gz -o /tmp/supabase.tar.gz
          tar xzf /tmp/supabase.tar.gz -C /tmp
          sudo mv /tmp/supabase /usr/local/bin/supabase
          supabase --version

      - name: Diagnose Docker Hub credentials
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          python3 - <<'PYEOF'
          import json
          import os
          import urllib.error
          import urllib.request

          username = os.environ.get("DOCKERHUB_USERNAME", "")
          token = os.environ.get("DOCKERHUB_TOKEN", "")

          print(f"USERNAME_LENGTH={len(username)}")
          print(f"TOKEN_LENGTH={len(token)}")
          print(f"USERNAME_HAS_CR={str(chr(13) in username).lower()}")
          print(f"USERNAME_HAS_LF={str(chr(10) in username).lower()}")
          print(f"TOKEN_HAS_CR={str(chr(13) in token).lower()}")
          print(f"TOKEN_HAS_LF={str(chr(10) in token).lower()}")
          print(f"TOKEN_STARTS_WITH_DCKR_PAT={str(token.startswith('dckr_pat_')).lower()}")

          payload = json.dumps({
              "identifier": username,
              "secret": token,
          }).encode("utf-8")

          request = urllib.request.Request(
              "https://hub.docker.com/v2/auth/token",
              data=payload,
              headers={"Content-Type": "application/json"},
              method="POST",
          )

          status = 0
          body = {}
          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  status = response.status
                  try:
                      body = json.loads(response.read().decode("utf-8"))
                  except Exception:
                      body = {}
          except urllib.error.HTTPError as error:
              status = error.code
          except Exception:
              status = 0

          print(f"DOCKER_HUB_AUTH_HTTP_STATUS={status}")

          if status == 200 and isinstance(body, dict) and body.get("access_token"):
              print("DOCKER_HUB_AUTH_RESULT=SUCCESS")
          else:
              print("DOCKER_HUB_AUTH_RESULT=FAILURE")
              raise SystemExit(1)
          PYEOF

      - name: Login to Docker Hub
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          printf '%s' "$DOCKERHUB_TOKEN" | docker login docker.io \
            --username "$DOCKERHUB_USERNAME" \
            --password-stdin

      - name: Start Supabase local
        id: supabase
        run: |
          for i in 1 2 3 4; do
            if supabase start; then break; fi
            echo "supabase start (tentative $i) échouée — nouvel essai dans 30s (rate limit Docker Hub)..."
            sleep 30
          done
          env_vars=$(supabase status -o env)
          anon_key=$(printf '%s\n' "$env_vars" | grep -iE '^anon_key=' | cut -d= -f2- | tr -d '"' | tr -d '[:space:]')
          service_role_key=$(printf '%s\n' "$env_vars" | grep -iE '^service_role_key=' | cut -d= -f2- | tr -d '"' | tr -d '[:space:]')
          if [ -z "$anon_key" ] || [ -z "$service_role_key" ]; then
            echo "::error::Impossible de récupérer les clés Supabase via 'supabase status -o env'."
            printf '%s\n' "$env_vars" | head -40
            exit 1
          fi
          echo "ANON_KEY=$anon_key" >> "$GITHUB_OUTPUT"
          echo "SERVICE_ROLE_KEY=$service_role_key" >> "$GITHUB_OUTPUT"
        working-directory: .

      - name: Reset database
        run: supabase db reset
        working-directory: .

      - name: Restore service_role privileges for Edge Functions (CI-only)
        run: |
          cat >/tmp/kaza-e2e-service-role-grants.sql <<'SQL'
          -- CI local only: the Edge Function uses service_role through PostgREST.
          -- Production privileges/RLS are unchanged by this runner-only SQL.
          grant usage on schema public to service_role;
          grant select, insert, update, delete on all tables in schema public to service_role;
          grant usage, select on all sequences in schema public to service_role;
          notify pgrst, 'reload schema';
          SQL
          docker exec -i supabase_db_kaza psql -U postgres -d postgres -v ON_ERROR_STOP=1 < /tmp/kaza-e2e-service-role-grants.sql
        working-directory: .

      - name: DB types drift check
        run: npm run db:types:check
        id: types-check

      - name: Upload generated types (debug artifact)
        if: always() && steps.types-check.outcome != 'success'
        uses: actions/upload-artifact@v4
        with:
          name: database-types-generated
          path: apps/web/src/lib/database.types.ts
          if-no-files-found: warn

      - name: Install CI-only test helpers
        run: |
          cat >/tmp/kaza-ci-test-helpers.sql <<'SQL'
          create or replace function public.get_function_source(p_function_name text)
          returns text
          language plpgsql
          security definer
          set search_path = public
          as $$
          declare
            v_source text;
          begin
            if auth.role() <> 'service_role' then
              raise exception 'Test-only helper';
            end if;
            select pg_get_functiondef(oid) into v_source
              from pg_proc
             where proname = p_function_name
               and pronamespace = 'public'::regnamespace
             limit 1;
            if v_source is null then
              raise exception 'Function % not found', p_function_name;
            end if;
            return v_source;
          end;
          $$;

          revoke all on function public.get_function_source(text) from public, anon, authenticated;
          grant execute on function public.get_function_source(text) to service_role;

          create or replace function public.reset_test_database()
          returns void
          language plpgsql
          security definer
          set search_path = public
          as $$
          begin
            if auth.role() <> 'service_role' then
              raise exception 'Test-only helper';
            end if;

            -- Les DELETE sont explicitement bornés (where true) : le garde-fou
            -- Supabase du CI rejette tout DELETE sans clause WHERE.
            delete from public.favorites where true;
            delete from public.messages where true;
            delete from public.receipts where true;
            delete from public.payments where true;
            delete from public.visits where true;
            delete from public.conversations where true;
            delete from public.leases where true;
            delete from public.notifications where true;
            delete from public.landlord_payouts where true;
            delete from public.admin_audit_logs where true;
            delete from public.residences where true;
          end;
          $$;

          revoke all on function public.reset_test_database() from public, anon, authenticated;
          grant execute on function public.reset_test_database() to service_role;

          -- CI-only : le client service_role des tests passe par PostgREST et
          -- nécessite les privileges SQL correspondants sur le schema public.
          -- Aucun effet en production (injecte uniquement ici, apres db reset).
          grant usage on schema public to service_role;
          grant select, insert, update, delete on all tables in schema public to service_role;
          grant usage, select on all sequences in schema public to service_role;

          -- Verification non sensible des privileges (echec explicite si absents).
          do $$
          begin
            if not has_schema_privilege('service_role', 'public', 'USAGE')
               or not has_table_privilege('service_role', 'public.profiles', 'UPDATE') then
              raise exception 'CI precondition failed: service_role privileges missing';
            end if;
          end;
          $$;

          -- Rechargement du cache de schema PostgREST pour prendre en compte
          -- les privileges fraichement accordes.
          notify pgrst, 'reload schema';
          SQL
          docker exec -i supabase_db_kaza psql -U postgres -d postgres -v ON_ERROR_STOP=1 < /tmp/kaza-ci-test-helpers.sql
        working-directory: .

      - name: Run DB integration tests
        run: npx vitest run -c vitest.config.integration.ts tests/integration
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://localhost:54321/
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ steps.supabase.outputs.ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ steps.supabase.outputs.SERVICE_ROLE_KEY }}
        working-directory: .

  e2e:
    runs-on: ubuntu-latest
    # note : 30 → 50 min — la phase diagnostic C1 refait un db reset et un
    # build Next (webServer CI) après la suite standard.
    timeout-minutes: 50
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Install Supabase CLI (pinned)
        run: |
          curl -fsSL https://github.com/supabase/cli/releases/download/v2.114.0/supabase_linux_amd64.tar.gz -o /tmp/supabase.tar.gz
          tar xzf /tmp/supabase.tar.gz -C /tmp
          sudo mv /tmp/supabase /usr/local/bin/supabase

      - name: Login to Docker Hub
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          printf '%s' "$DOCKERHUB_TOKEN" | docker login docker.io \
            --username "$DOCKERHUB_USERNAME" \
            --password-stdin

      - name: Start Supabase local
        id: supabase
        run: |
          for i in 1 2 3 4; do
            if supabase start; then break; fi
            echo "supabase start (tentative $i) échouée — nouvel essai dans 30s..."
            sleep 30
          done
          env_vars=$(supabase status -o env)
          anon_key=$(printf '%s\n' "$env_vars" | grep -iE '^anon_key=' | cut -d= -f2- | tr -d '"' | tr -d '[:space:]')
          if [ -z "$anon_key" ]; then
            echo "::error::Impossible de récupérer l'ANON_KEY."
            printf '%s\n' "$env_vars" | head -40
            exit 1
          fi
          echo "ANON_KEY=$anon_key" >> "$GITHUB_OUTPUT"
        working-directory: .

      - name: Reset database
        run: supabase db reset
        working-directory: .

      - name: Restart Realtime after database migrations
        run: |
          docker restart supabase_realtime_kaza
          for i in $(seq 1 30); do
            status=$(docker inspect -f '{{.State.Status}}' supabase_realtime_kaza 2>/dev/null || true)
            if [ "$status" = "running" ]; then
              echo "Realtime is running after migration reset."
              exit 0
            fi
            sleep 1
          done
          echo "::error::Realtime container did not return to running state."
          docker logs --tail 200 supabase_realtime_kaza || true
          exit 1
        working-directory: .

      - name: Restore service_role privileges for Edge Functions (CI-only)
        run: |
          cat >/tmp/kaza-e2e-service-role-grants.sql <<'SQL'
          -- CI local only: receipts-sign uses service_role through PostgREST.
          grant usage on schema public to service_role;
          grant select, insert, update, delete on all tables in schema public to service_role;
          grant usage, select on all sequences in schema public to service_role;
          notify pgrst, 'reload schema';
          SQL
          docker exec -i supabase_db_kaza psql -U postgres -d postgres -v ON_ERROR_STOP=1 < /tmp/kaza-e2e-service-role-grants.sql
        working-directory: .

      - name: Run e2e tests with receipts-sign
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://localhost:54321/
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ steps.supabase.outputs.ANON_KEY }}
          NEXT_PUBLIC_APP_URL: http://localhost:3000/
          NEXT_PUBLIC_HCAPTCHA_SITEKEY: ""
        run: |
          set -e

          # Aligner explicitement l'Edge Function sur le Supabase local.
          # Cela évite toute ambiguïté d'environnement pour getAdminClient().
          env_vars=$(supabase status -o env)
          supabase_url=$(printf '%s\n' "$env_vars" | grep -iE '^API_URL=' | cut -d= -f2- | tr -d '"' | tr -d '[:space:]')
          service_role_key=$(printf '%s\n' "$env_vars" | grep -iE '^service_role_key=' | cut -d= -f2- | tr -d '"' | tr -d '[:space:]')
          if [ -z "$supabase_url" ] || [ -z "$service_role_key" ]; then
            echo "::error::Impossible de récupérer les paramètres Supabase locaux pour receipts-sign."
            exit 1
          fi
          export SUPABASE_URL="$supabase_url"
          export SUPABASE_SERVICE_ROLE_KEY="$service_role_key"
          echo "receipts-sign cible Supabase local: $SUPABASE_URL"

          # Garder receipts-sign vivant pendant toute l'exécution Playwright :
          # le process background ne doit pas mourir entre deux steps GitHub Actions.
          cat >/tmp/kaza-edge.env <<EOF
          SUPABASE_URL=$SUPABASE_URL
          SUPABASE_SERVICE_ROLE_KEY=$SUPABASE_SERVICE_ROLE_KEY
          EOF

          # Supabase CLI 2.114.0 ne prend pas le nom de fonction en argument
          # positionnel. Il sert les Edge Functions locales et on vérifie
          # explicitement que receipts-sign répond sur la route attendue.
          # Le process reste vivant dans ce même step pendant tout Playwright.
          supabase functions serve --env-file /tmp/kaza-edge.env > /tmp/kaza-receipts-sign.log 2>&1 &
          FUNCTION_PID=$!
          trap 'kill "$FUNCTION_PID" 2>/dev/null || true' EXIT

          # Polling borné sur la disponibilité HTTP de la route : un 401/400
          # (JWT requis, corps invalide) prouve que la route répond — seul le
          # 404 « route inexistante » est un échec. Aucun token ni body sensible.
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' \
              -X POST http://127.0.0.1:54321/functions/v1/receipts-sign \
              -H 'Content-Type: application/json' \
              -d '{}' || echo '000')
            if [ "$code" != '000' ] && [ "$code" != '404' ]; then
              echo "receipts-sign disponible (HTTP $code)"
              break
            fi
            if [ "$i" = '30' ]; then
              echo "::error::receipts-sign indisponible après 60s"
              tail -80 /tmp/kaza-receipts-sign.log || true
              exit 1
            fi
            sleep 2
          done

          cd apps/web
          npx playwright install chromium
          cd ../..

          # Conserver le log Edge Function uniquement en cas d'échec E2E :
          # il permet de distinguer un process mort d'une erreur métier HTTP.
          set +e
          NEXT_PUBLIC_KAZA_RESIDENCE_DIAGNOSTICS=1 npm run test:e2e
          TEST_STATUS=$?
          set -e
          if [ "$TEST_STATUS" -ne 0 ]; then
            echo "::group::receipts-sign diagnostics"
            if kill -0 "$FUNCTION_PID" 2>/dev/null; then
              echo "receipts-sign process toujours vivant au moment de l'échec."
            else
              echo "::error::receipts-sign process terminé avant l'échec E2E."
            fi
            tail -200 /tmp/kaza-receipts-sign.log || true
            echo "::group::realtime diagnostics"
            docker inspect -f '{{json .State}}' supabase_realtime_kaza 2>/dev/null || true
            docker logs --tail 200 supabase_realtime_kaza 2>/dev/null || true
            echo "::endgroup::"
            echo "::endgroup::"
          fi
          exit "$TEST_STATUS"

      - name: Upload e2e report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          # note : sans reporter html configuré, playwright-report/ n'existe pas ;
          # test-results/ porte les contextes d'erreur de la suite standard.
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          if-no-files-found: warn
          retention-days: 7

      # ------------------------------------------------------------------
      # Phase DIAGNOSTIC C1 — séparée de la suite standard ci-dessus.
      # S'exécute même si la suite standard a échoué (le job reste alors en
      # échec). Base fraîche : db reset + redémarrage Realtime. Seuls les tests
      # « Diagnostic Realtime C1 » tournent, avec E2E_REALTIME_DIAG=1.
      # Ce step échoue si : un test C1 échoue, est skipped, n'a pas produit son
      # rapport JSON, ou si un verdict est autre que no-reproduction
      # (inconclusive compris).
      # ------------------------------------------------------------------
      # C1 est un diagnostic d'investigation, pas une condition de vert de la suite E2E.
      # Une observation dedicated-client reste visible dans les artefacts sans
      # masquer le résultat des tests métier. La suite E2E reste bloquante sur ses vrais tests.
      - name: Realtime C1 diagnostic (fresh database)
        id: c1
        continue-on-error: true
        if: ${{ !cancelled() && steps.supabase.outcome == 'success' }}
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://localhost:54321/
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ steps.supabase.outputs.ANON_KEY }}
          NEXT_PUBLIC_APP_URL: http://localhost:3000/
          NEXT_PUBLIC_HCAPTCHA_SITEKEY: ""
          C1_DIR: ${{ github.workspace }}/c1-diagnostic
        run: |
          set -e
          echo "=== C1 DIAGNOSTIC START ==="
          trap 'echo "=== C1 DIAGNOSTIC END ==="' EXIT
          mkdir -p "$C1_DIR"

          echo "::group::C1 — base fraîche (supabase db reset)"
          supabase db reset
          echo "::endgroup::"

          echo "::group::C1 — redémarrage supabase_realtime_kaza"
          docker restart supabase_realtime_kaza
          realtime_status=""
          for i in $(seq 1 30); do
            realtime_status=$(docker inspect -f '{{.State.Status}}' supabase_realtime_kaza 2>/dev/null || true)
            if [ "$realtime_status" = "running" ]; then
              echo "C1: Realtime running après reset (tentative $i)."
              break
            fi
            sleep 1
          done
          if [ "$realtime_status" != "running" ]; then
            echo "::error::C1: le container Realtime n'est pas revenu à l'état running."
            docker logs --tail 200 supabase_realtime_kaza || true
            exit 1
          fi
          docker inspect -f '{{json .State}}' supabase_realtime_kaza > "$C1_DIR/realtime-state-before.json" || true
          echo "::endgroup::"

          echo "::group::C1 — privilèges service_role CI (parité avec la phase standard)"
          cat >/tmp/kaza-c1-service-role-grants.sql <<'SQL'
          -- CI local only : mêmes privilèges que la phase standard après db reset.
          grant usage on schema public to service_role;
          grant select, insert, update, delete on all tables in schema public to service_role;
          grant usage, select on all sequences in schema public to service_role;
          notify pgrst, 'reload schema';
          SQL
          docker exec -i supabase_db_kaza psql -U postgres -d postgres -v ON_ERROR_STOP=1 < /tmp/kaza-c1-service-role-grants.sql
          echo "::endgroup::"

          cd apps/web
          set +e
          E2E_REALTIME_DIAG=1 \
          PLAYWRIGHT_JSON_OUTPUT_FILE="$C1_DIR/playwright-c1.json" \
            npx playwright test --project=chromium --grep "Diagnostic Realtime C1" \
              --reporter=list,json \
              --trace=retain-on-failure \
              --output="$C1_DIR/test-results" 2>&1 | tee "$C1_DIR/playwright-c1.log"
          C1_STATUS=${PIPESTATUS[0]}
          set -e
          cd ../..

          docker logs --tail 500 supabase_realtime_kaza > "$C1_DIR/realtime.log" 2>&1 || true
          grep -F '[KAZA:C1]' "$C1_DIR/playwright-c1.log" > "$C1_DIR/kaza-c1-stdout.log" || true

          echo "::group::C1 — extraction des rapports"
          set +e
          node - <<'JS'
          const fs = require('fs');
          const path = require('path');
          const dir = process.env.C1_DIR;
          const lines = [];
          const out = (line) => { console.log(line); lines.push(line.replace(/^::\w+( [^:]*)?::/, '')); };
          let failed = false;
          let report;
          try {
            report = JSON.parse(fs.readFileSync(path.join(dir, 'playwright-c1.json'), 'utf8'));
          } catch (error) {
            out(`::error::C1: rapport Playwright JSON absent ou illisible (${error.message})`);
            fs.writeFileSync(path.join(dir, 'c1-summary.txt'), lines.join('\n') + '\n');
            process.exit(1);
          }
          const tests = [];
          const walk = (suite, titles) => {
            (suite.suites || []).forEach((child) => walk(child, [...titles, child.title]));
            (suite.specs || []).forEach((spec) =>
              (spec.tests || []).forEach((test) =>
                tests.push({ title: [...titles, spec.title].filter(Boolean).join(' › '), test }),
              ),
            );
          };
          walk(report, []);
          const c1 = tests.filter(({ title }) => title.includes('Diagnostic Realtime C1'));
          out(`C1: ${c1.length} test(s) diagnostic trouvé(s) (attendu : 2)`);
          if (c1.length !== 2) {
            out('::error::C1: nombre de tests diagnostic inattendu');
            failed = true;
          }
          const expected = ['c1-chat-diagnostic.json', 'c1-visits-diagnostic.json'];
          const written = new Set();
          c1.forEach(({ title, test }) => {
            const results = test.results || [];
            const statuses = results.map((result) => result.status).join(',') || 'aucun résultat';
            if (test.status === 'skipped') {
              out(`::error::C1 SKIPPED — ${title} : E2E_REALTIME_DIAG non pris en compte`);
              failed = true;
            }
            const attachments = results.flatMap((result) => result.attachments || [])
              .filter((attachment) => /^c1-.*\.json$/.test(attachment.name) && attachment.body);
            if (attachments.length === 0) {
              out(`::error::C1 RAPPORT ABSENT — ${title} (statut=${test.status}, résultats=${statuses})`);
              failed = true;
              return;
            }
            attachments.forEach((attachment) => {
              const body = Buffer.from(attachment.body, 'base64').toString('utf8');
              fs.writeFileSync(path.join(dir, attachment.name), body);
              written.add(attachment.name);
              let verdict = 'illisible';
              let meaning = '';
              try {
                const parsed = JSON.parse(body);
                verdict = parsed.verdict;
                meaning = parsed.meaning;
                out(`C1 ${attachment.name} observation=${JSON.stringify(parsed.observation)}`);
              } catch {
                failed = true;
              }
              const line = `C1 ${attachment.name} — ${title} : statut=${test.status} verdict=${verdict} — ${meaning}`;
              if (verdict === 'no-reproduction') {
                out(line);
              } else if (verdict === 'inconclusive') {
                out(`::error title=C1 INCONCLUSIVE::${line}`);
                failed = true;
              } else {
                out(`::error title=C1 VERDICT ${verdict}::${line}`);
                failed = true;
              }
            });
          });
          expected.filter((name) => !written.has(name)).forEach((name) => {
            out(`::error::C1 fichier attendu manquant : ${name}`);
            failed = true;
          });
          fs.writeFileSync(path.join(dir, 'c1-summary.txt'), lines.join('\n') + '\n');
          process.exit(failed ? 1 : 0);
          JS
          SUMMARY_STATUS=$?
          set -e
          echo "::endgroup::"

          echo "C1: statut Playwright=$C1_STATUS, statut rapports=$SUMMARY_STATUS"
          if [ -f "$C1_DIR/c1-summary.txt" ]; then
            { echo '### Diagnostic Realtime C1'; echo '```'; cat "$C1_DIR/c1-summary.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "$C1_STATUS" -ne 0 ] || [ "$SUMMARY_STATUS" -ne 0 ]; then
            echo "::error::C1: diagnostic en échec ou non concluant — voir l'artefact c1-diagnostic."
            exit 1
          fi

      - name: Upload C1 diagnostic reports
        if: ${{ !cancelled() && steps.c1.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: c1-diagnostic
          path: c1-diagnostic/
          if-no-files-found: error
          retention-days: 14

  edge-functions:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Install Supabase CLI (pinned)
        run: |
          curl -fsSL https://github.com/supabase/cli/releases/download/v2.114.0/supabase_linux_amd64.tar.gz -o /tmp/supabase.tar.gz
          tar xzf /tmp/supabase.tar.gz -C /tmp
          sudo mv /tmp/supabase /usr/local/bin/supabase

      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.3.3

      - name: Lint Edge Functions (Deno)
        run: |
          for f in supabase/functions/*/index.ts; do
            echo "Checking $f..."
            deno lint "$f" || exit 1
          done
        working-directory: .

      - name: Typecheck Edge Functions (Deno)
        run: |
          for f in supabase/functions/*/index.ts; do
            echo "Typechecking $f..."
            # --config : Deno ne découvre pas supabase/functions/deno.json depuis la
            # racine du repo ; sans lui, les imports npm: sont résolus contre le
            # node_modules npm de la racine (échec sur npm:@sentry/deno) au lieu du
            # cache global + deno.lock des Edge Functions.
            deno check --config supabase/functions/deno.json "$f" || exit 1
          done
        working-directory: .

  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Audit dependencies
        run: npm audit --audit-level=high --workspace apps/web