name: CI

on:
  push:
    branches:
      - main
      - validation/phase-b-errors-20260924
  pull_request:
    branches:
      - main
      - "hardening/**"
  workflow_dispatch:

concurrency:
  group: ci-light-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint, typecheck, unit tests & build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://ci-build.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-build-anon-key-no-secret
          NEXT_PUBLIC_APP_URL: https://ci-build.kaza.local
          NEXT_PUBLIC_HCAPTCHA_SITEKEY: ci-build-sitekey-no-secret

      - name: Secret leak scan
        run: |
          if grep -rnEi "(sk_live_|sk_dev_|sbp_[A-Za-z0-9]{16,}|vcp_[A-Za-z0-9]{16,}|xkeysib-|xox[bap]-|service_role\s*[:=]\s*['\"][a-zA-Z0-9]{20,}|BEGIN (RSA|EC|OPENSSH|DSA) PRIVATE KEY|KazaDemo)" apps/web/src supabase/functions | grep -vE ':[0-9]+: \*|:[0-9]+: //' ; then
            echo "::error::Secret ou clé détecté(e) dans le code source. Retirez-le avant de merger."
            exit 1
          fi

  mobile-quality:
    name: Mobile typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Typecheck mobile
        run: npm run typecheck:mobile
